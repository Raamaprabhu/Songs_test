<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --text:#1c1c22; --muted:#6b6b78; --accent:#6c4cf1; --line:#e4e4ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141a; --card:#1e1e27; --text:#f1f1f5; --muted:#9a9aa8; --accent:#8d74ff; --line:#2c2c38; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding-bottom:150px; }
  header { padding:20px 16px 8px; max-width:720px; margin:auto; }
  h1 { margin:0; font-size:1.5rem; }
  #status { color:var(--muted); font-size:.9rem; margin-top:4px; }
  .sel { width:100%; margin-top:12px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; }
  #search { width:100%; margin:12px 0; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; }
  ul { list-style:none; margin:0 auto; padding:0 16px; max-width:720px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; padding:12px 14px; cursor:pointer; display:flex; gap:10px; align-items:center; }
  li.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  li .n { color:var(--muted); width:28px; flex-shrink:0; font-size:.85rem; }
  li .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  li .k { flex-shrink:0; font-size:.95rem; }
  #player { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
  #player .in { max-width:720px; margin:auto; }
  #now { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  /* One <video> element plays both audio and video files.
     Audio-only files show just the control bar; video files show the picture. */
  #audio { width:100%; display:block; background:#000; border-radius:8px; }
  #audio.audio-only { height:54px; background:transparent; }
  #audio.is-video { height:auto; max-height:38vh; aspect-ratio:16/9; }
  .ctrl { display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .ctrl button { border:1px solid var(--line); background:var(--bg); color:var(--text); padding:8px 14px; border-radius:8px; font-size:.95rem; cursor:pointer; }
  .ctrl button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🎵 My Music</h1>
  <div id="status">Loading…</div>
  <select id="folder" class="sel"></select>
  <input id="search" type="search" placeholder="Search songs">
</header>
<ul id="list"></ul>

<div id="player"><div class="in">
  <div id="now">Select a song</div>
  <video id="audio" class="audio-only" controls playsinline preload="auto"></video>
  <div class="ctrl">
    <button id="prev">⏮ Prev</button>
    <button id="next">Next ⏭</button>
    <button id="shuffle">🔀 Shuffle</button>
    <button id="repeat">🔁 Repeat</button>
    <button id="auto" class="on">▶️ Autoplay</button>
  </div>
</div></div>

<script>
/* ========== CONFIG ========== */
// GROUP 1: songs from these folders are shown under "All folders" AND when the folder is selected.
const FOLDERS_IN_ALL = [
  { name: "Tamil Old songs", id: "1psbK5WAq4hd9H0tdcSAzjGVqhlyk4XoV" },
  { name: "Tamil New songs", id: "1bDUQE5MT8fxmLrUbX44E7FIrSaktKfQ2" },
  { name: "Ghazals-Hariharan", id: "1cqoGNiBACCSoFSGj8t9uycv3ANYEsmfg" },
  { name: "Ghazals-Misc", id: "1j3NZEyo_K-TfHiXjf88lArqDrmWLXFMD" },
  { name: "Hindi Movie songs", id: "1kSG8VTyU1aoUTmy6w5IwwT1DTQde9eAB" },
];

// GROUP 2: songs from these folders are NOT mixed into "All folders".
// They appear in the dropdown and are listed only when that folder is selected.
const FOLDERS_SEPARATE = [
  { name: "Bhakti songs/Bhajans", id: "1vvm8nH44O79Gxl2vwGtq3-0JaxwacSSU" },
  { name: "Karaoke Video Songs", id: "1-x3IvbYXkE_IfDy9FIo0Ezbd9SXg7HOp" },
];

// Create a free key: Google Cloud Console > enable "Google Drive API" > Credentials > API key.
// Folder must be shared as "Anyone with the link: Viewer".
const API_KEY = "AIzaSyD25jQGfZwbtOBqyGrgfaTgwn8PcG2A4is";

// Optional manual list (used if API key isn't set). Get the ID from each file's share link:
// https://drive.google.com/file/d/FILE_ID/view
// Add  video: true  for video files, and  inAll: false  to keep a song out of "All folders".
const MANUAL_SONGS = [
  // { name: "Song name", id: "FILE_ID", folder: "Music", video: false },
];
/* ============================ */

const FOLDERS = [
  ...FOLDERS_IN_ALL.map(f => ({ ...f, inAll: true })),
  ...FOLDERS_SEPARATE.map(f => ({ ...f, inAll: false }))
];

const audio = document.getElementById("audio");   // actually a <video> element; plays audio and video
const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
let songs = [], view = [], current = -1, shuffle = false, repeat = false;
let rank = new Map();   // random position of each song while Shuffle is on
let autoplay = true, failCount = 0;
try { const v = localStorage.getItem("autoplay"); if (v !== null) autoplay = v === "1"; } catch (e) {}

const hasKey = API_KEY && !API_KEY.startsWith("PASTE");
// Link types tried in order until one plays
const sourcesFor = id => [
  ...(hasKey ? [`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${API_KEY}`] : []),
  `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`,
  `https://drive.google.com/uc?export=download&id=${id}&confirm=t`
];
let srcTry = 0;

// Keep the list from being hidden behind the player (it grows when a video is showing)
const playerEl = document.getElementById("player");
function fitPadding() { document.body.style.paddingBottom = (playerEl.offsetHeight + 20) + "px"; }
if ("ResizeObserver" in window) new ResizeObserver(fitPadding).observe(playerEl);
window.addEventListener("resize", fitPadding);
fitPadding();

async function loadFolder(folder) {
  let token = "", all = [];
  do {
    const q = encodeURIComponent(`'${folder.id}' in parents and (mimeType contains 'audio/' or mimeType contains 'video/') and trashed=false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&orderBy=name&key=${API_KEY}` + (token ? `&pageToken=${token}` : "");
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Drive API error ${res.status} (folder: ${folder.name})`);
    const data = await res.json();
    all = all.concat(data.files); token = data.nextPageToken || "";
  } while (token);
  return all.map(f => ({
    name: f.name.replace(/\.(mp3|m4a|wav|ogg|flac|aac|mp4|m4v|mov|webm|mkv)$/i, ""),
    id: f.id,
    folder: folder.name,
    inAll: folder.inAll,
    video: (f.mimeType || "").startsWith("video/")
  }));
}

async function loadSongs() {
  if (hasKey) {
    const parts = await Promise.all(FOLDERS.filter(f => !f.id.startsWith("PASTE")).map(loadFolder));
    return parts.flat();
  }
  return MANUAL_SONGS.map(m => ({ ...m, folder: m.folder || "Songs", inAll: m.inAll !== false }));
}

function render() {
  const term = document.getElementById("search").value.toLowerCase();
  const fol = document.getElementById("folder").value;
  // Songs that belong to the current dropdown selection
  const scope = songs.filter(s => fol === "__all" ? s.inAll : s.folder === fol);
  view = scope.filter(s => s.name.toLowerCase().includes(term));
  if (shuffle) view.sort((a, b) => rank.get(a) - rank.get(b));   // shuffled order shown on screen
  // Count at the top follows the selected folder (and the search, if any)
  if (songs.length) {
    statusEl.textContent = term
      ? `${view.length} of ${scope.length} songs`
      : `${scope.length} songs`;
  }
  listEl.innerHTML = "";
  view.forEach((s, i) => {
    const li = document.createElement("li");
    if (songs[current] === s) li.className = "active";
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"></span><span class="k">${s.video ? "🎬" : ""}</span>`;
    li.querySelector(".t").textContent = s.name;
    li.onclick = () => play(songs.indexOf(s));
    listEl.appendChild(li);
  });
}

function play(i) {
  if (i < 0 || i >= songs.length) return;
  current = i;
  const s = songs[i];
  srcTry = 0;
  audio.classList.toggle("is-video", !!s.video);
  audio.classList.toggle("audio-only", !s.video);
  audio.referrerPolicy = "no-referrer";
  audio.src = sourcesFor(s.id)[0];
  audio.play().catch(() => {});
  document.getElementById("now").textContent = (s.video ? "🎬 " : "") + s.name;
  document.title = s.name;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: "My Music" });
  }
  render();
}

function next() {
  if (!view.length) return;
  const pos = view.indexOf(songs[current]);
  play(songs.indexOf(view[(pos + 1) % view.length]));
}
function prev() {
  if (!view.length) return;
  const pos = view.indexOf(songs[current]);
  play(songs.indexOf(view[(pos - 1 + view.length) % view.length]));
}

// Lock-screen / notification controls so playback continues when minimized
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", next);
  navigator.mediaSession.setActionHandler("previoustrack", prev);
  try {
    navigator.mediaSession.setActionHandler("seekto", d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
    navigator.mediaSession.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    navigator.mediaSession.setActionHandler("seekforward", () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 10); });
  } catch (e) {}
  audio.addEventListener("play", () => navigator.mediaSession.playbackState = "playing");
  audio.addEventListener("pause", () => navigator.mediaSession.playbackState = "paused");
}

// Same media element is reused for every track, so the browser keeps
// playing (and moving to the next song) even when the app is minimized or the screen is locked.
audio.addEventListener("playing", () => { failCount = 0; });
audio.addEventListener("ended", () => {
  if (repeat) return play(current);
  if (autoplay) return next();
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
});
audio.addEventListener("error", () => {
  if (current < 0) return;
  const list = sourcesFor(songs[current].id);
  if (++srcTry < list.length) {
    audio.src = list[srcTry];
    audio.play().catch(() => {});
  } else {
    const code = audio.error ? audio.error.code : "?";
    statusEl.textContent = "Couldn't play (error " + code + "). Add an API key in the code, and open this page from a web host, not as a local file." +
      (songs[current].video ? " (Some video formats, e.g. MKV/AVI, aren't supported by browsers; MP4 with H.264 works best.)" : "");
    // Don't let one bad file stop the playlist: skip ahead (max 3 in a row)
    if (autoplay && failCount++ < 3) setTimeout(next, 800);
  }
});
document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;
document.getElementById("shuffle").onclick = e => {
  shuffle = !shuffle;
  e.target.classList.toggle("on", shuffle);
  if (shuffle) {
    // Fisher-Yates shuffle of all songs; the song now playing goes to the top
    const arr = songs.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    rank = new Map();
    arr.forEach((s, i) => rank.set(s, i));
    if (current >= 0) rank.set(songs[current], -1);
  }
  render();   // off = back to alphabetical order
};
document.getElementById("repeat").onclick = e => { repeat = !repeat; e.target.classList.toggle("on", repeat); };
document.getElementById("auto").classList.toggle("on", autoplay);
document.getElementById("auto").onclick = e => {
  autoplay = !autoplay; e.target.classList.toggle("on", autoplay);
  try { localStorage.setItem("autoplay", autoplay ? "1" : "0"); } catch (err) {}
};
document.getElementById("search").oninput = render;
document.getElementById("folder").onchange = render;

loadSongs().then(list => {
  songs = list;
  const sel = document.getElementById("folder");
  sel.innerHTML = "";
  const addOpt = (value, label) => {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    sel.appendChild(o);
  };
  addOpt("__all", "All folders");
  // Every folder from both groups is listed in the dropdown
  [...new Set(songs.map(x => x.folder))].forEach(n => addOpt(n, n));
  if (!songs.length) statusEl.textContent = "No songs yet. Add your API key or MANUAL_SONGS in the code.";
  render();
}).catch(err => { statusEl.textContent = err.message; });
</script>
<script src="https://raamaprabhu.github.io/songs/disable_rightclick.js"></script>
</body>
</html>
