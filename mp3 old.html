<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Audio Streaming Jukebox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        .audio-wave-placeholder {
            width: 80px;
            height: 80px;
            background: #282828;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 25px 0;
        }
        .control-btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .control-btn:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        .nav-btn {
            background: transparent;
            color: #b3b3b3;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .nav-btn:hover {
            color: white;
            border-color: white;
        }
        .playlist {
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 15px;
            max-height: 180px;
            overflow-y: auto;
        }
        .playlist-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background 0.2s;
            font-size: 14px;
            background: #282828;
        }
        .playlist-item:hover {
            background: #3e3e3e;
        }
        .playlist-item.active {
            background: #1db954;
            color: white;
            font-weight: bold;
        }
        #status {
            font-size: 13px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="audio-wave-placeholder">🎵</div>
        <h3 id="now-playing">Select a Track</h3>
        <p id="status">System Ready</p>

        <div class="controls">
            <button class="nav-btn" onclick="previousTrack()">Prev</button>
            <button class="control-btn" id="play-pause-btn" onclick="togglePlayback()">Play</button>
            <button class="nav-btn" onclick="nextTrack()">Next</button>
        </div>

        <div class="playlist" id="playlist-container"></div>
    </div>

    <script>
        // 1. CONFIGURE YOUR REAL MUSIC LINKS HERE
        // Replace these URLs with real .mp3 links. They can be relative files in your GitHub folder or online direct file streams.
        const tracks = [
            { title: "Poi sollakoodathu", url: "https://drive.google.com/file/d/1Ex9Cg3yFEGo90EkuVxrA8MvaJyX6qzWo/view" },
            { title: "Lofi Study Beats", url: "https://www.youtube.com/watch?v=xeCFY5ZoK9c" },
            { title: "Synthwave Nightdrive", url: "https://www.youtube.com/watch?v=KTgScPRo5ow" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        
        // Native browser background audio pipeline allocation
        let audioNode = new Audio();

        // Build the playlist panel
        function buildPlaylistUI() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = "";
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = "playlist-item" + (index === currentTrackIndex ? " active" : "");
                item.innerText = `${index + 1}. ${track.title}`;
                item.onclick = () => loadAndPlayTrack(index);
                container.appendChild(item);
            });
        }

        function loadAndPlayTrack(index) {
            currentTrackIndex = index;
            audioNode.src = tracks[currentTrackIndex].url;
            audioNode.load();
            
            updateTrackUI();
            
            audioNode.play()
                .then(() => {
                    isPlaying = true;
                    document.getElementById('play-pause-btn').innerText = "Pause";
                    document.getElementById('status').innerText = "Streaming Audio Content...";
                    activateMediaSessionControls();
                })
                .catch(err => {
                    console.error("Playback block: ", err);
                    document.getElementById('status').innerText = "Load error. Verify link address.";
                });
        }

        function togglePlayback() {
            // Initial interaction safeguard fallback
            if (!audioNode.src) {
                loadAndPlayTrack(0);
                return;
            }

            if (isPlaying) {
                audioNode.pause();
                isPlaying = false;
                document.getElementById('play-pause-btn').innerText = "Play";
                document.getElementById('status').innerText = "Paused";
            } else {
                audioNode.play().then(() => {
                    isPlaying = true;
                    document.getElementById('play-pause-btn').innerText = "Pause";
                    document.getElementById('status').innerText = "Streaming Audio Content...";
                });
            }
        }

        function nextTrack() {
            let nextIndex = (currentTrackIndex + 1) % tracks.length;
            loadAndPlayTrack(nextIndex);
        }

        function previousTrack() {
            let prevIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadAndPlayTrack(prevIndex);
        }

        function updateTrackUI() {
            document.getElementById('now-playing').innerText = tracks[currentTrackIndex].title;
            const items = document.getElementsByClassName('playlist-item');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
                if (i === currentTrackIndex) {
                    items[i].classList.add('active');
                }
            }
        }

        // Automatic queue sequencing
        audioNode.addEventListener('ended', () => {
            nextTrack();
        });

        // Ties background process directly into Windows/Mac/iOS/Android OS notification layers
        function activateMediaSessionControls() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: tracks[currentTrackIndex].title,
                    artist: 'Personal Jukebox',
                    album: 'GitHub Pages Cloud'
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlayback());
                navigator.mediaSession.setActionHandler('pause', () => togglePlayback());
                navigator.mediaSession.setActionHandler('previoustrack', () => previousTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            }
        }

        // Initialize setup on frame load completion
        window.onload = () => {
            buildPlaylistUI();
            document.getElementById('now-playing').innerText = tracks[0].title;
        };
    </script>
</body>
</html>
